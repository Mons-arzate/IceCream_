<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKZOO</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <img src="./imagenes/icon.jpeg" alt="" width="50px" width="50px" height="50px"
                    style="border-radius: 50%;">
                <p> SKZOO - ice Cream</p>
            </div>

            <nav class="header-nav">
                <a href="#inicio">Inicio</a>
                <a href="#sabores">Sabores</a>
            </nav>

            <button class="header-btn">Encuentra SKZOO</button>
        </div>
    </header>

    <section id="sabores" class="flavors-section">
        <h2 class="flavors-title">Elige tu Sabor <span class="logo-tag">SKZOO</span></h2>

        <div class="cards-container">

            <div class="card" style=" background: #ffd2d2; border: 2px solid #d8b74a;">
                <span class="card-label">VAINILLA</span>
                <div class="scoop-wrapper">
                    <svg viewBox="0 0 120 120" class="scoop">
                        <circle cx="60" cy="60" r="50" fill="#FFF6D9" />
                        <circle cx="45" cy="45" r="10" fill="#FFFDF5" opacity="0.7" />
                    </svg>
                </div>
                <p class="card-desc">Ingredientes naturales. Sabor real hecho para días soleados.</p>
            </div>

            <div class="card" style="background: #b8a94d; border: 2px solid #FFE07D;">
                <span class="card-label">GALLETA & CREMA</span>
                <div class="scoop-wrapper">
                    <svg viewBox="0 0 120 120" class="scoop">
                        <circle cx="60" cy="60" r="50" fill="#F5F1E6" />
                        <circle cx="40" cy="50" r="5" fill="#5C4A3D" />
                        <circle cx="70" cy="40" r="4" fill="#5C4A3D" />
                        <circle cx="55" cy="75" r="4.5" fill="#5C4A3D" />
                        <circle cx="80" cy="70" r="3.5" fill="#5C4A3D" />
                    </svg>
                </div>
                <p class="card-desc">Ingredientes naturales. Sabor real hecho para días soleados.</p>
            </div>


        </div>
    </section>

</body>

</html>
